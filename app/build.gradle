plugins {
    id 'com.android.application'
}

android {
    namespace 'com.botna.automation'
    compileSdk 36

    defaultConfig {
        applicationId 'com.botna.automation'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '0.23.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'org.opencv:opencv:4.13.0'
}
